name: Public Lean verification
run-name: Public Lean proof verification @ ${{ github.sha }}

# Full verification starts on a PR, before the workflow exists on default.
# Normally builds every native certificate from source. PR 2's audit-helper
# repair reuses one pinned public run after checking unchanged proof sources.
"on":
  pull_request:
    paths:
      - "lean/**"
      - ".github/lean/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: public-lean-${{ github.ref }}
  cancel-in-progress: false

env:
  ELAN_HOME: ${{ github.workspace }}/.tools/elan
  ELAN_TOOLCHAIN: leanprover/lean4:v4.32.1

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cap4: ${{ steps.plan.outputs.cap4 }}
      other: ${{ steps.plan.outputs.other }}
      recovery: ${{ steps.recovery.outputs.recovery }}
      artifact-run-id: ${{ steps.recovery.outputs.artifact-run-id }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Verify published sources and plan all native certificates
        id: plan
        run: python3 -I .github/lean/prepare.py
      - name: Select clean build or exactly pinned audit-helper recovery
        id: recovery
        run: |
          echo "66790f5d3ea9b07e248d29fe0e888144028bbb7ed7ff7b7bb08f9dff57db9e2a  .github/lean/recovery.py" | sha256sum --check -
          python3 -I .github/lean/recovery.py plan

  base:
    name: clean shared dependency build
    needs: plan
    if: needs.plan.outputs.recovery != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Bootstrap pinned Lean and public Mathlib dependencies
        run: bash .github/lean/bootstrap.sh
      - name: Build native-free dependencies from source
        run: |
          set -euo pipefail
          mapfile -t targets < .ci-plan/base-roots.txt
          (cd lean && /usr/bin/time -v lake build "${targets[@]}") 2>&1 | tee base-build.log
          python3 -I .github/lean/prepare.py
          python3 -I .github/lean/artifacts.py pack base-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: base-build
          path: base-output
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: base-build-log
          path: base-build.log
          retention-days: 14

  native-cap4:
    name: native (${{ matrix.module }})
    needs: [plan, base]
    if: needs.plan.outputs.recovery != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.cap4) }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Bootstrap pinned Lean and public Mathlib dependencies
        run: bash .github/lean/bootstrap.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: base-build
          path: artifacts/base
      - name: Restore same-run base
        run: python3 -I .github/lean/artifacts.py restore artifacts/base
      - name: Compile this native certificate from source
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          python3 -I .github/lean/prepare.py
          test ! -e "lean/.lake/build/lib/lean/${MODULE//.//}.olean"
          (cd lean && /usr/bin/time -v lake build "$MODULE") 2>&1 | tee native-build.log
          python3 -I .github/lean/prepare.py
          python3 -I .github/lean/artifacts.py pack native-output --module "$MODULE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.module }}
          path: native-output
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: log-${{ matrix.module }}
          path: native-build.log
          retention-days: 14

  native-other:
    name: native (${{ matrix.module }})
    needs: [plan, base]
    if: needs.plan.outputs.recovery != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.other) }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Bootstrap pinned Lean and public Mathlib dependencies
        run: bash .github/lean/bootstrap.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: base-build
          path: artifacts/base
      - name: Restore same-run base
        run: python3 -I .github/lean/artifacts.py restore artifacts/base
      - name: Compile this native certificate from source
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          python3 -I .github/lean/prepare.py
          test ! -e "lean/.lake/build/lib/lean/${MODULE//.//}.olean"
          (cd lean && /usr/bin/time -v lake build "$MODULE") 2>&1 | tee native-build.log
          python3 -I .github/lean/prepare.py
          python3 -I .github/lean/artifacts.py pack native-output --module "$MODULE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.module }}
          path: native-output
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: log-${{ matrix.module }}
          path: native-build.log
          retention-days: 14

  verify:
    name: full build, exact axiom audit and fresh kernel replay
    needs: [plan, base, native-cap4, native-other]
    if: >-
      ${{ always() && needs.plan.result == 'success' &&
          ((needs.plan.outputs.recovery == 'true' &&
            needs.base.result == 'skipped' &&
            needs.native-cap4.result == 'skipped' &&
            needs.native-other.result == 'skipped') ||
           (needs.plan.outputs.recovery == 'false' &&
            needs.base.result == 'success' &&
            needs.native-cap4.result == 'success' &&
            needs.native-other.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Bootstrap pinned Lean and public Mathlib dependencies
        run: bash .github/lean/bootstrap.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: base-build
          path: artifacts/base
          run-id: ${{ needs.plan.outputs.artifact-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Download pinned recovery artifacts with complete pagination and pacing
        if: needs.plan.outputs.recovery == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/lean/download_recovery.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.recovery != 'true'
        with:
          pattern: native-*
          path: artifacts/native
          run-id: ${{ needs.plan.outputs.artifact-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Restore the complete native certificate set with exact provenance
        env:
          RECOVERY: ${{ needs.plan.outputs.recovery }}
        run: |
          set -euo pipefail
          if [[ "$RECOVERY" == true ]]; then
            python3 -I .github/lean/recovery.py restore
          else
            python3 -I .github/lean/artifacts.py restore artifacts/base
            python3 -I .github/lean/artifacts.py restore-native artifacts/native
          fi
          python3 -I .github/lean/prepare.py
      - name: Build all published proof roots and audit their exact axioms
        run: |
          set -euo pipefail
          mapfile -t targets < .ci-plan/targets.txt
          (cd lean && /usr/bin/time -v lake build "${targets[@]}") 2>&1 | tee full-build.log
          python3 -I .github/lean/prepare.py
          (cd lean && lake env lean ../.ci-plan/AxiomAudit.lean) 2>&1 | tee axiom-audit.log
          grep -q 'AXIOM AUDIT PASSED' axiom-audit.log
      - name: Fresh kernel replay of full coverage
        env:
          ARTIFACT_RUN_ID: ${{ needs.plan.outputs.artifact-run-id }}
        run: |
          set -euo pipefail
          # Coverage imports Main; KnownAsymptotic contains only a background Prop.
          (cd lean && /usr/bin/time -v lake env leanchecker --fresh Results.Genus.Native.Coverage) 2>&1 | tee fresh-replay.log
          (cd lean && /usr/bin/time -v lake env leanchecker --fresh Results.Genus.Native.KnownAsymptotic) 2>&1 | tee background-replay.log
          python3 -I .github/lean/prepare.py
          {
            echo "Verified public commit: $GITHUB_SHA"
            echo "All 279 native certificates compiled from identical proof sources in public run $ARTIFACT_RUN_ID."
            echo "Recovery origin, when used: .ci-plan/recovery-origin.json."
            echo "Full proof build, exact axiom audit and fresh kernel replay passed."
            echo "Trust: Lean kernel plus standard axioms and compiled native evaluation."
            echo "Fresh replay does not independently re-prove the native calculations."
          } | tee verification-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verification-evidence
          path: |
            full-build.log
            axiom-audit.log
            fresh-replay.log
            background-replay.log
            verification-summary.txt
            .ci-plan
            .github/lean/source-sha256.json
          include-hidden-files: true
          retention-days: 30

